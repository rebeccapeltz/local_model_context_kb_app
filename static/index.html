<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Notebook</title>
<style>
  :root {
    --paper: #FAF8F3;
    --ink: #232323;
    --ink-soft: #6B665C;
    --rule: #DAD3C3;
    --accent: #2B6E62;
    --accent-soft: #E4EFEC;
    --tool: #A8672F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .page {
    width: 100%;
    max-width: 640px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }
  header {
    padding: 28px 0 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header .session {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .context-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .context-row button {
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
  }
  .context-row button:hover { border-color: var(--accent); color: var(--accent); }
  .context-row .status { flex: 1; }

  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 18px 0 12px;
  }
  .turn {
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
    line-height: 1.55;
    font-size: 14.5px;
  }
  .turn:last-child { border-bottom: none; }
  .turn .who {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .turn.user .who { color: var(--accent); }
  .turn.tool {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 12.5px;
    color: var(--tool);
  }
  .turn pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: inherit;
    margin: 0;
  }

  /* Rendered markdown from the assistant */
  .markdown-body { font-size: 14.5px; }
  .markdown-body > *:first-child { margin-top: 0; }
  .markdown-body > *:last-child { margin-bottom: 0; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 {
    font-family: Georgia, "Times New Roman", serif;
    margin: 14px 0 6px;
    line-height: 1.3;
  }
  .markdown-body p { margin: 8px 0; }
  .markdown-body ul, .markdown-body ol { margin: 8px 0; padding-left: 22px; }
  .markdown-body li { margin: 3px 0; }
  .markdown-body a { color: var(--accent); }
  .markdown-body code {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    background: var(--accent-soft);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
  }
  .markdown-body pre {
    background: #232323;
    color: #F3F1EA;
    padding: 12px 14px;
    border-radius: 5px;
    overflow-x: auto;
  }
  .markdown-body pre code {
    background: none;
    color: inherit;
    padding: 0;
  }
  .markdown-body blockquote {
    margin: 8px 0;
    padding: 2px 14px;
    border-left: 3px solid var(--rule);
    color: var(--ink-soft);
  }
  .markdown-body table {
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13.5px;
  }
  .markdown-body th, .markdown-body td {
    border: 1px solid var(--rule);
    padding: 5px 10px;
    text-align: left;
  }

  form.composer {
    display: flex;
    gap: 8px;
    padding: 14px 0 22px;
    border-top: 1px solid var(--rule);
  }
  form.composer textarea {
    flex: 1;
    resize: none;
    height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: white;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
  }
  form.composer textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  form.composer button {
    border: none;
    background: var(--accent);
    color: white;
    padding: 0 18px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  form.composer button:disabled { opacity: 0.5; cursor: default; }
  form.composer button:hover:not(:disabled) { background: #235a50; }

  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 0 10px;
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Study Notebook</h1>
      <span class="session" id="sessionLabel">starting…</span>
    </header>

    <div class="context-row">
      <span class="status" id="contextStatus">Load notes from ./context_files into this session?</span>
      <button id="loadYes">Yes, load</button>
      <button id="loadNo">No, skip</button>
    </div>

    <p class="hint" id="hint">Ask a question below. Say "save that to a folder called &lt;name&gt;" to write the answer to disk.</p>

    <div class="thread" id="thread"></div>

    <form class="composer" id="composer">
      <textarea id="messageInput" placeholder="Ask a question…" disabled></textarea>
      <button type="submit" id="sendBtn" disabled>Send</button>
    </form>
  </div>

<script>
  const thread = document.getElementById('thread');
  const sessionLabel = document.getElementById('sessionLabel');
  const contextStatus = document.getElementById('contextStatus');
  const loadYes = document.getElementById('loadYes');
  const loadNo = document.getElementById('loadNo');
  const composer = document.getElementById('composer');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  let sessionId = null;

  // Plain-text turns (user input, tool/error output): rendered with
  // textContent so nothing in them is ever interpreted as HTML.
  function addTurn(who, text, cls) {
    const div = document.createElement('div');
    div.className = 'turn ' + (cls || '');
    div.innerHTML = `<div class="who">${who}</div><pre></pre>`;
    div.querySelector('pre').textContent = text;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
  }

  // Assistant turns: the server already converted markdown -> HTML and
  // sanitized it (see render_markdown_safe in app.py), so it's safe to
  // drop straight into innerHTML here.
  function addAssistantTurn(html) {
    const div = document.createElement('div');
    div.className = 'turn assistant';
    div.innerHTML = `<div class="who">Assistant</div><div class="markdown-body"></div>`;
    div.querySelector('.markdown-body').innerHTML = html;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
  }

  function lockContextRow(message) {
    contextStatus.textContent = message;
    loadYes.disabled = true;
    loadNo.disabled = true;
  }

  async function startSession() {
    const res = await fetch('/api/session', { method: 'POST' });
    const data = await res.json();
    sessionId = data.session_id;
    sessionLabel.textContent = sessionId.slice(0, 8);
    messageInput.disabled = false;
    sendBtn.disabled = false;
  }

  async function decideContext(load) {
    lockContextRow(load ? 'Loading context…' : 'Context loading skipped.');
    const res = await fetch('/api/context', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, load_context: load }),
    });
    const data = await res.json();
    lockContextRow(data.message);
  }

  loadYes.addEventListener('click', () => decideContext(true));
  loadNo.addEventListener('click', () => decideContext(false));

  composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = messageInput.value.trim();
    if (!message) return;

    addTurn('You', message, 'user');
    messageInput.value = '';
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message }),
      });
      const data = await res.json();
      if (data.error) {
        addTurn('Error', data.error, 'tool');
      } else if (data.response_html) {
        addAssistantTurn(data.response_html);
      } else {
        addTurn('Assistant', data.response || '(no reply)');
      }
    } catch (err) {
      addTurn('Error', String(err), 'tool');
    } finally {
      sendBtn.disabled = false;
      messageInput.focus();
    }
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      composer.requestSubmit();
    }
  });

  startSession();
</script>
</body>
</html>
